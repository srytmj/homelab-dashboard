services:
  homelab-cockpit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: homelab-cockpit
    restart: unless-stopped
    ports:
      - "8050:3000" # Access UI at http://<DOCKER_HOST_IP>:8050
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - DOCKER_SOCKET=/var/run/docker.sock
      - PROXMOX_URL=https://192.168.18.224:8006
      - PROXMOX_NODE=pve
      - PROXMOX_TOKEN_ID=${PROXMOX_TOKEN_ID:-}
      - PROXMOX_TOKEN_SECRET=${PROXMOX_TOKEN_SECRET:-}
      - PROXMOX_REJECT_UNAUTHORIZED=false
      - TAILSCALE_API_KEY=${TAILSCALE_API_KEY:-}
      - TAILSCALE_TAILNET=${TAILSCALE_TAILNET:-}
      - TAILSCALE_SOCKET=/var/run/tailscale/tailscaled.sock
      - STORAGE_MOUNTS=/,/mnt/hdd-media,/mnt/hdd-cloud,/mnt/hdd-music
      - POLL_INTERVAL_MS=2000
      - DEMO_MODE=${DEMO_MODE:-false}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_ALLOWED_USER_IDS=${TELEGRAM_ALLOWED_USER_IDS:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - MANAGED_CONTAINERS=${MANAGED_CONTAINERS:-jellyfin,nextcloud,t3-code,nginx-proxy-manager,uptime-kuma,portainer-ce,transmission,paperless-ngx,home-assistant}
    volumes:
      # Persistent Owner Auth & Sessions
      - ./data:/app/data
      # Docker Socket access for real-time container metrics & control
      - /var/run/docker.sock:/var/run/docker.sock
      # Tailscale Daemon Socket (optional: allows reading live local tailscaled status)
      - /var/run/tailscale:/var/run/tailscale:ro
      # Storage mount points (read-only) for storage capacity matrix
      - /mnt/hdd-media:/mnt/hdd-media:ro
      - /mnt/hdd-cloud:/mnt/hdd-cloud:ro
      - /mnt/hdd-music:/mnt/hdd-music:ro
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
